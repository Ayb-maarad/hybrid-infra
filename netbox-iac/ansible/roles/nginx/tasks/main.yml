- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Deploy NetBox nginx site
  template:
    src: netbox.conf.j2
    dest: /etc/nginx/sites-available/netbox
    mode: "0644"

- name: Enable NetBox nginx site
  file:
    src: /etc/nginx/sites-available/netbox
    dest: /etc/nginx/sites-enabled/netbox
    state: link
    force: true

- name: Disable default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Test nginx configuration
  command: nginx -t
  changed_when: false

- name: Enable and reload nginx
  systemd:
    name: nginx
    enabled: true
    state: reloaded