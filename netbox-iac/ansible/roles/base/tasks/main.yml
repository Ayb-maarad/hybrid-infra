- name: Install minimal packages
  apt:
    update_cache: true
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential
      - libxml2-dev
      - libxslt1-dev
      - libffi-dev
      - libpq-dev
      - libssl-dev
      - zlib1g-dev
      - curl
      - tar
    state: present

- name: Install pynetbox globally on target machine
  pip:
    name: pynetbox
    state: present
    extra_args: --break-system-packages

- name: Remove apt cache
  apt:
    autoclean: true

- name: Autoremove unused packages
  apt:
    autoremove: true
    purge: true